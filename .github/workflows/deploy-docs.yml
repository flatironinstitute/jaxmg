name: Docs

# Versioned docs, managed by mike (https://github.com/jimporter/mike) on the
# gh-pages branch. This workflow only ever publishes the mutable `dev` version
# built from main; numbered versions and the `latest` alias are published by
# release.yml from a tag, so a published version always matches a real wheel.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/jaxmg/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/jaxmg/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
  workflow_dispatch:

# release.yml also pushes gh-pages. Share one concurrency group so two mike
# deploys can never race into a rejected non-fast-forward push.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      - name: Build MkDocs site
        run: mkdocs build --strict --clean --site-dir site-check

  deploy-dev:
    name: Publish 'dev' docs to gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # mike needs the gh-pages history
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      - name: Configure git identity for mike
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Ensure the deployment branch is present locally
        run: git fetch origin gh-pages --depth=1 || echo "gh-pages does not exist yet"

      - name: Publish dev docs
        # --allow-empty so a re-run or a no-op main push doesn't fail the job.
        # No --update-aliases: `dev` carries no aliases. No set-default either --
        # the root redirect points at the `latest` alias, which only releases move.
        run: |
          mike deploy --push --allow-empty --alias-type=copy \
            --branch gh-pages \
            --title 'dev (main)' \
            dev
