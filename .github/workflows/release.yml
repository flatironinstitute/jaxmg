name: Release

# Tag-driven release. Builds BOTH arches on GHA (single x86 build feeds both the
# Jenkins GPU test and the publish), gates on the A100 tests, publishes to
# TestPyPI automatically, then to PyPI after a manual approval. PyPI auth is via
# Trusted Publishing (OIDC) -- no tokens stored anywhere.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'x.y.z[pre] for a dry run (no tag)'
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            V="${DISPATCH_VERSION}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "Release version: ${V}"
          echo "${V}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([abc]|rc)?[0-9]*$' \
            || { echo "Version '${V}' is not a valid release version" >&2; exit 1; }
          echo "version=${V}" >> "$GITHUB_OUTPUT"

  build-x86:
    needs: version
    uses: ./.github/workflows/build-wheels.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04
      compile_image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
      package_image: quay.io/pypa/manylinux_2_28_x86_64
      manylinux_plat: manylinux_2_28_x86_64
      version: ${{ needs.version.outputs.version }}

  build-aarch64:
    needs: version
    uses: ./.github/workflows/build-wheels.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
      compile_image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build-arm64:latest
      package_image: quay.io/pypa/manylinux_2_28_aarch64
      manylinux_plat: manylinux_2_28_aarch64
      version: ${{ needs.version.outputs.version }}

  # Gate the release on the A100 tests (x86 wheels from this run).
  test-x86:
    needs: build-x86
    permissions:
      actions: read        # so github.token can download the wheel artifacts
    uses: ./.github/workflows/jenkins-test.yml
    with:
      gha_run_id: ${{ github.run_id }}
      git_sha: ${{ github.sha }}
      branch: main       # releases are cut from main; that job checks out git_sha
    secrets: inherit

  publish-testpypi:
    needs: [build-x86, build-aarch64, test-x86]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Collect all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi   # add a required reviewer to this environment -> approval gate
    permissions:
      id-token: write
    steps:
      - name: Collect all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Collect all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Attach wheels to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
