[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxmg"
version = "1.0.0"
description = "JAXMg provides a jittable C++/CUDA interface between JAX and NVIDIA cuSOLVERMp."
authors = [{ name = "Roeland Wiersema" }]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "jax==0.10.1; sys_platform == 'linux'",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/flatironinstitute/jaxmg"
Issues = "https://github.com/flatironinstitute/jaxmg/issues"
Docs = "https://flatironinstitute.github.io/jaxmg/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jaxmg = [
    "cu12/libjaxmg_xla_comm_backend.so",
    "cu13/libjaxmg_xla_comm_backend.so",
]

[tool.pytest.ini_options]
markers = [
    "cpu_only: tests that do not require GPUs",
    "gpu: tests that require at least one GPU",
    "mpmd: multi-process multi-device GPU tests",
    "slow: longer validation sweeps",
]

[project.optional-dependencies]

docs = [
    "jax>=0.6.2",
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.23",
    "mkdocstrings==0.30.1",
    "mkdocs-exclude==1.0.2",
    "hippogriffe==0.2.2",
]

dev = [
    "matplotlib>=3.10.3",
    "jax[cuda12]==0.10.1",
    "nvidia-cusolvermp-cu12==0.8.0.3126",
    "pytest==8.2.1",
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.23",
    "mkdocstrings==0.30.1",
    "mkdocs-exclude==1.0.2",
    "hippogriffe==0.2.2",
]

cuda12 = [
    "jax[cuda12]==0.10.1",
    "nvidia-cusolvermp-cu12==0.8.0.3126",
]

cuda13 = [
    "jax[cuda13]==0.10.1",
    "nvidia-cusolvermp-cu13==0.8.0.3126",
]

cuda12-local = [
    "jax[cuda12-local]==0.10.1",
    "nvidia-cusolvermp-cu12==0.8.0.3126",
]

cuda13-local = [
    "jax[cuda13-local]==0.10.1",
    "nvidia-cusolvermp-cu13==0.8.0.3126",
]
